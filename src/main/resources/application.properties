# Spring Boot Application Properties
spring.application.name=MoonPhase
# Web application type: set to 'none' for headless (no Tomcat)
# spring.main.web-application-type=none
spring.main.web-application-type=servlet
server.port=8080
# Java 25 virtual threads for Tomcat, @Scheduled, and task execution
spring.threads.virtual.enabled=true
# Graceful shutdown so in-flight requests and SSE clients drain cleanly
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Compress JSON/static responses (SSE streams are typically not compressed)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
# Scheduling — twice daily at 00:01 and 12:01 UTC (override with CRON_SCHEDULE)
app.cron=${CRON_SCHEDULE:0 1 0,12 * * *}
# Logging
logging.level.root=INFO
logging.level.org.iHarwood=INFO
# Application configuration (env overrides supported)
app.latitude=${LATITUDE:51.4769}
app.longitude=${LONGITUDE:0.0}
awtrix.hostname=${AWTRIXHOSTNAME:http://moonclock.local}
# MongoDB historical data (set APP_HISTORY_ENABLED=true and SPRING_DATA_MONGODB_URI to enable)
app.history.enabled=false
app.history.retention-days=0
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://storenator.bluelarma.com:27017/moonphase}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:moonphase}
# Manual MongoConfig owns the beans when history is enabled; keep Boot auto-config off
# so headless / history-disabled runs never attempt a Mongo connection.
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
# Actuator — liveness/readiness for containers; custom domain health stays at /api/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
# Claude API (optional moon-phase cross-check; log-only, never overrides formula)
# CLAUDE_API_KEY, CLAUDE_MODEL (default claude-sonnet-4-6), CLAUDE_API_URL
